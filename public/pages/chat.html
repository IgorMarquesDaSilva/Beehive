<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beehive - Chat</title>
  <link rel="stylesheet" href="/css/chat.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="workspace">
        <div class="brand-mark" aria-hidden="true">B</div>
        <div class="workspace-copy">
          <h1>Beehive</h1>
          <p>Workspace Engenharia</p>
        </div>
        <button
          class="workspace-settings"
          type="button"
          onclick="window.location.href='/pages/configuracoes.html'"
          title="Configurações"
        >
          Config.
        </button>
      </div>

      <div class="sidebar-section channels-section">
        <div class="section-title">
          <span>Canais</span>
          <button type="button" onclick="abrirModalCanal()" title="Criar canal">
            +
          </button>
        </div>
        <div id="lista-canais" class="channel-list"></div>
      </div>

      <div class="sidebar-section online-section">
        <div class="section-title">
          <span>Membros</span>
        </div>

        <div class="online-user">
          <div class="avatar azul">EU</div>
          <div class="online-user-info">
            <strong id="nome-usuario">Carregando...</strong>
            <select id="status-select" onchange="alterarStatus()" aria-label="Status">
              <option value="online">Online</option>
              <option value="ausente">Ausente</option>
              <option value="ocupado">Ocupado</option>
              <option value="offline">Invisível</option>
            </select>
          </div>
          <span class="online-dot status-online" id="meu-status-dot"></span>
        </div>

        <div id="lista-online" class="online-list"></div>
        <div id="lista-voz" class="voice-list"></div>
      </div>

      <div class="sidebar-footer">
        <a href="/pages/perfil.html">Meu perfil</a>
        <button type="button" onclick="logout()">Sair</button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <div class="channel-heading">
          <h2 id="canal-ativo">Selecione um canal</h2>
          <p>Conversa da equipe</p>
        </div>

        <div class="header-actions">
          <div class="channel-search">
            <input
              type="search"
              id="busca-canal"
              placeholder="Buscar neste canal"
              autocomplete="off"
              aria-label="Buscar mensagens no canal"
            />
            <div id="resultados-busca" class="search-results"></div>
          </div>
          <button
            class="header-settings"
            type="button"
            onclick="window.location.href='/pages/configuracoes.html'"
          >
            Configurações
          </button>
        </div>
      </header>

      <section class="chat-mensagens" id="chat-mensagens">
        <div class="chat-empty-state" data-tipo="empty">
          <strong>Selecione um canal</strong>
          <span>Escolha um canal na barra lateral para ver a conversa.</span>
        </div>
      </section>

      <div class="digitando-container">
        <span id="digitando-texto"></span>
      </div>

      <footer class="chat-input-area">
        <div class="format-toolbar">
          <button type="button" onclick="abrirSeletorArquivo()">
            Anexar arquivo
          </button>
          <input
            type="file"
            id="input-arquivo"
            hidden
            onchange="uploadArquivo(event)"
          />
        </div>

        <div class="message-box">
          <div class="input-wrapper">
            <div id="sugestoes-mencao" class="sugestoes-mencao"></div>
            <input
              type="text"
              id="msg-input"
              placeholder="Escreva uma mensagem"
              autocomplete="off"
            />
          </div>
          <button class="send-btn" type="button" onclick="enviar()">Enviar</button>
        </div>
      </footer>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="fecharModalCanal()"></div>

  <div class="modal" id="modal-canal">
    <h3>Criar canal</h3>
    <p class="modal-description">Organize uma nova conversa para a equipe.</p>

    <label for="canal-nome">Nome</label>
    <input type="text" id="canal-nome" placeholder="Ex.: planejamento" />

    <label for="canal-descricao">Descrição</label>
    <input
      type="text"
      id="canal-descricao"
      placeholder="Descrição opcional"
    />

    <div class="canal-privado-box">
      <label class="checkbox-container">
        <input
          type="checkbox"
          id="canal-privado"
          onchange="toggleCanalPrivado()"
        />
        <div>
          <strong>Canal privado</strong>
          <small>Apenas membros convidados poderão acessar.</small>
        </div>
      </label>
    </div>

    <div
      id="selecionar-membros"
      class="selecionar-membros"
      style="display:none"
    >
      <h4>Selecionar membros</h4>
      <div id="lista-membros-canal" class="lista-membros-canal"></div>
    </div>

    <div class="modal-botoes">
      <button class="btn-cancelar" type="button" onclick="fecharModalCanal()">
        Cancelar
      </button>
      <button class="btn-criar" type="button" onclick="criarCanal()">
        Criar canal
      </button>
    </div>
    <p class="erro" id="canal-erro"></p>
  </div>

  <div class="modal-overlay" id="modal-chamada-overlay"></div>

  <div class="modal" id="modal-chamada" style="display:none">
    <h3>Chamada recebida</h3>
    <p id="chamada-nome"></p>
    <div class="modal-botoes">
      <button class="btn-cancelar" type="button" onclick="recusarChamada()">
        Recusar
      </button>
      <button class="btn-criar" type="button" onclick="aceitarChamada()">
        Aceitar
      </button>
    </div>
  </div>

  <div class="voz-painel" id="voz-painel" style="display:none">
    <div class="voz-header">
      <span id="voz-titulo">Canal de voz</span>
      <button class="btn-sair-voz" type="button" onclick="sairVoz()">Sair</button>
    </div>
    <div class="voz-membros" id="voz-membros"></div>
    <div class="voz-controles">
      <button class="btn-mute" id="btn-mute" type="button" onclick="toggleMute()">
        Microfone ativo
      </button>
    </div>
  </div>

  <div id="toast-container"></div>

  <audio id="notification-sound">
    <source
      src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=message-pop-alert-2354.mp3"
      type="audio/mpeg"
    />
  </audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/voz.js"></script>
</body>
</html>
