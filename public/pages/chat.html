<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beehive 🐝 - Chat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="chat-container">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>🐝 Beehive</h2>
        <p id="nome-usuario">Carregando...</p>
        <a href="/pages/perfil.html" class="btn-perfil">Ver meu perfil</a>
      </div>

      <div class="canais-titulo">
        Canais
        <span class="btn-novo-canal" onclick="abrirModalCanal()">+</span>
      </div>
      <div id="lista-canais"></div>

      <div class="canais-titulo" style="margin-top: 8px;">
        Voz
      </div>
      <div id="lista-voz"></div>

      <div class="sidebar-footer">
        <button onclick="logout()">Sair</button>
      </div>
    </div>

    <!-- ÁREA PRINCIPAL -->
    <div class="chat-main">
      <div class="chat-header" id="canal-ativo">
        Selecione um canal
      </div>

      <div class="chat-mensagens" id="chat-mensagens"></div>

      <div class="digitando-container">
        <span id="digitando-texto"></span>
      </div>

      <div class="chat-input">
        <div class="input-wrapper">
          <div id="sugestoes-mencao" class="sugestoes-mencao"></div>
          <input
            type="text"
            id="msg-input"
            placeholder="Digite sua mensagem... (use @ para mencionar)"
          />
        </div>
        <button onclick="enviar()">Enviar</button>
      </div>
    </div>

  </div>

  <!-- MODAL CRIAR CANAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="fecharModalCanal()"></div>
  <div class="modal" id="modal-canal">
    <h3>Novo Canal</h3>
    <input type="text" id="canal-nome" placeholder="Nome do canal (ex: financeiro)" />
    <input type="text" id="canal-descricao" placeholder="Descrição (opcional)" />
    <div class="modal-botoes">
      <button class="btn-cancelar" onclick="fecharModalCanal()">Cancelar</button>
      <button class="btn-criar" onclick="criarCanal()">Criar</button>
    </div>
    <p class="erro" id="canal-erro"></p>
  </div>

  <!-- MODAL CHAMADA RECEBIDA -->
  <div class="modal-overlay" id="modal-chamada-overlay"></div>
  <div class="modal" id="modal-chamada" style="display:none">
    <h3>📞 Chamada recebida</h3>
    <p id="chamada-nome" style="color:#e0e0e0; margin-bottom: 20px;"></p>
    <div class="modal-botoes">
      <button class="btn-cancelar" onclick="recusarChamada()">Recusar</button>
      <button class="btn-criar" onclick="aceitarChamada()" style="background-color:#2ecc71;">Aceitar</button>
    </div>
  </div>

  <!-- PAINEL DE VOZ -->
  <div class="voz-painel" id="voz-painel" style="display:none">
    <div class="voz-header">
      <span id="voz-titulo">🎙️ Canal de voz</span>
      <button class="btn-sair-voz" onclick="sairVoz()">Sair</button>
    </div>
    <div class="voz-membros" id="voz-membros"></div>
    <div class="voz-controles">
      <button class="btn-mute" id="btn-mute" onclick="toggleMute()">🎙️ Mudo</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/voz.js"></script>
</body>
</html>
