<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beehive 🐝 - Perfil</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="perfil-container">

    <div class="perfil-box">
      <div class="perfil-header">
        <a href="/pages/chat.html" class="btn-voltar">← Voltar ao chat</a>
        <h1>🐝 Meu Perfil</h1>
      </div>

      <div class="perfil-avatar">
        <div class="avatar-circulo" id="avatar-iniciais"></div>
      </div>

      <div class="perfil-form">
        <label>Nome</label>
        <input type="text" id="perfil-nome" placeholder="Seu nome" />

        <label>Email</label>
        <input type="email" id="perfil-email" disabled />

        <label>Bio</label>
        <input type="text" id="perfil-bio" placeholder="Fale um pouco sobre você..." />

        <label>Membro desde</label>
        <input type="text" id="perfil-criado" disabled />

        <hr class="divisor" />

        <h3>Alterar senha</h3>
        <label>Senha atual</label>
        <input type="password" id="senha-atual" placeholder="Digite sua senha atual" />

        <label>Nova senha</label>
        <input type="password" id="senha-nova" placeholder="Digite a nova senha" />

        <button onclick="salvarPerfil()">Salvar alterações</button>
        <p class="sucesso" id="perfil-sucesso"></p>
        <p class="erro" id="perfil-erro"></p>
      </div>

    </div>
  </div>

  <script src="/js/perfil.js"></script>
</body>
</html>
