<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beehive - Meu perfil</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="profile-page">
  <header class="profile-topbar">
    <a class="profile-brand" href="/pages/chat.html">
      <span class="brand-mark" aria-hidden="true">B</span>
      <span>Beehive</span>
    </a>
    <a href="/pages/chat.html" class="btn-voltar">Voltar ao chat</a>
  </header>

  <main class="perfil-container">
    <section class="perfil-box">
      <div class="perfil-header">
        <div>
          <span class="page-eyebrow">Conta</span>
          <h1>Meu perfil</h1>
          <p>Atualize suas informações pessoais e sua senha.</p>
        </div>
        <div class="perfil-avatar">
          <div class="avatar-circulo" id="avatar-iniciais"></div>
        </div>
      </div>

      <div class="perfil-form">
        <div class="form-grid">
          <div class="field-group">
            <label for="perfil-nome">Nome</label>
            <input type="text" id="perfil-nome" placeholder="Seu nome" />
          </div>

          <div class="field-group">
            <label for="perfil-email">E-mail</label>
            <input type="email" id="perfil-email" disabled />
          </div>

          <div class="field-group field-full">
            <label for="perfil-bio">Bio</label>
            <input
              type="text"
              id="perfil-bio"
              placeholder="Uma breve descrição sobre você"
            />
          </div>

          <div class="field-group field-full">
            <label for="perfil-criado">Membro desde</label>
            <input type="text" id="perfil-criado" disabled />
          </div>
        </div>

        <div class="form-section-title">
          <h2>Alterar senha</h2>
          <p>Preencha apenas se quiser definir uma nova senha.</p>
        </div>

        <div class="form-grid">
          <div class="field-group">
            <label for="senha-atual">Senha atual</label>
            <input
              type="password"
              id="senha-atual"
              placeholder="Senha atual"
              autocomplete="current-password"
            />
          </div>

          <div class="field-group">
            <label for="senha-nova">Nova senha</label>
            <input
              type="password"
              id="senha-nova"
              placeholder="Nova senha"
              autocomplete="new-password"
            />
          </div>
        </div>

        <div class="profile-actions">
          <button type="button" onclick="salvarPerfil()">Salvar alterações</button>
        </div>

        <p class="sucesso" id="perfil-sucesso"></p>
        <p class="erro" id="perfil-erro"></p>
      </div>
    </section>
  </main>

  <script src="/js/perfil.js"></script>
</body>
</html>
